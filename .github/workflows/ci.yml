name: CI

# Runs the full frontend and backend test suites with coverage.
#
# The same jobs are reused by the test-agent workflow (via workflow_call) to
# verify the tests the agent commits – so the agent never grades its own work.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch or SHA) to test; defaults to the triggering ref
        required: false
        type: string
    outputs:
      frontend_summary:
        description: Markdown summary of the frontend run
        value: ${{ jobs.frontend.outputs.summary }}
      backend_summary:
        description: Markdown summary of the backend run
        value: ${{ jobs.backend.outputs.summary }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.summary.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile=coverage/junit.xml

      - name: Summarize
        id: summary
        if: always()
        run: |
          python3 .github/scripts/summarize_frontend.py frontend/coverage/junit.xml frontend/coverage/coverage-summary.json > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          { echo 'markdown<<EOF'; cat summary.md; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: frontend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/junit.xml
            frontend/coverage/lcov.info
          retention-days: 14

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.summary.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=json --junitxml=coverage/junit.xml

      - name: Summarize
        id: summary
        if: always()
        run: |
          python3 .github/scripts/summarize_backend.py backend/coverage/junit.xml backend/coverage/coverage.json > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          { echo 'markdown<<EOF'; cat summary.md; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/coverage/coverage.json
            backend/coverage/junit.xml
          retention-days: 14
